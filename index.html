  html { scroll-behavior: smooth; scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }

  .no-scrollbar { scrollbar-width: none; }

  .grain::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* блик, пробегающий по карточке, и подсветка под курсором */
  .card-shine { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
  .card-shine::before { content: ''; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.8), transparent); transform: translateX(0) skewX(-18deg); }
  .group:hover .card-shine::before { transform: translateX(520%) skewX(-18deg); transition: transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .card-glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; border-radius: inherit;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.5), transparent 62%); }
  .group:hover .card-glare { opacity: 1; }

  select { appearance: none; -webkit-appearance: none; }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* пользователь отключил анимации — отключаем и CSS-анимации */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .animate-marquee, .animate-shimmer { animation: none !important; }
    *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #FBF7F2; }
  #splash span { font: 600 28px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .3em; color: #6B1F2E; text-transform: uppercase;
                 animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>

/* Квиз «подбор по типу кожи» */
const QUIZ = [
  { id: 'skin',    opts: ['dry', 'oily', 'combo', 'normal', 'sensitive'] },
  { id: 'concern', opts: ['hydration', 'aging', 'glow', 'acne'] },
  { id: 'cat',     opts: ['face', 'makeup', 'hairbody', 'perfume', 'all'] },
  { id: 'budget',  opts: ['b1', 'b2', 'b3', 'b4'] },
];
const QUIZ_BUDGETS = { b1: [0, 7000], b2: [7000, 15000], b3: [15000, Infinity], b4: [0, Infinity] };
const QUIZ_CATS = { face: ['face'], makeup: ['makeup'], hairbody: ['hair', 'body'], perfume: ['perfume'], all: null };

const quizLabelKey = (qid, opt) =>
  qid === 'cat' ? (opt === 'all' || opt === 'hairbody' ? `quiz.cat.${opt}` : `cat.${opt}`) : `quiz.${qid === 'budget' ? 'budget' : qid}.${opt}`;

/** Возвращает id товаров, подходящих под ответы квиза (лучшие — первыми). */
function matchProducts(a) {
  const hi = QUIZ_BUDGETS[a.budget][1];
  const groups = QUIZ_CATS[a.cat];
  const pool = PRODUCTS.filter((p) => !groups || groups.includes(p.cat));
  const scored = pool
    .map((p) => {
      let s = p.rating - 4.5;
      if (p.skin.length === 0) s += 1; else if (p.skin.includes(a.skin)) s += 2;
      if (p.concern.includes(a.concern)) s += 2;
      s += p.price <= hi ? 1 : -3;
      return { p, s };
    })
    .sort((x, y) => y.s - x.s);
  const inBudget = scored.filter((x) => x.p.price <= hi * 1.25);   // запасной вариант: бюджет чуть шире
  let picked = scored.filter((x) => x.s >= 3).slice(0, 8);
  if (picked.length < 3) picked = (inBudget.length ? inBudget : scored.slice().sort((x, y) => x.p.price - y.p.price)).slice(0, 4);
  return picked.map((x) => x.p.id);
}

function ruPlural(n, [one, few, many]) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* localStorage с защитой: в превью/приватном режиме он может быть недоступен */
const store = {
  get(key, fallback) {
    try { const v = window.localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  },
  set(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* игнорируем */ }
  },
};

/* Телефон: маска +7 (___) ___-__-__ */
function parsePhone(v) {
  let d = String(v).replace(/\D/g, '');
  if (String(v).trim().startsWith('+7')) d = d.slice(1);
  else if (d.length >= 11 && (d[0] === '7' || d[0] === '8')) d = d.slice(1);
  return d.slice(0, 10);
}
function formatPhone(d) {
  if (!d) return '';
  let s = '+7 (' + d.slice(0, 3);
  if (d.length > 3) s += ') ' + d.slice(3, 6);
  if (d.length > 6) s += '-' + d.slice(6, 8);
  if (d.length > 8) s += '-' + d.slice(8, 10);
  return s;
}
const validName = (v) => v.trim().split(/\s+/).filter((w) => w.length >= 2).length >= 2;

   5. ОТПРАВКА ЗАКАЗА — единственное место, которое нужно подключить к
      Telegram-боту / WhatsApp / CRM
   ========================================================================== */
function orderToText(o) {
  const L = I18N.ru;
  const lines = o.items.map((i) => `• ${i.name}${i.shade ? ` (${i.shade})` : ''} × ${i.qty} = ${fmt(i.total)}`);
  const addr = o.delivery.method === 'pickup'
    ? L['d.pickup']
    : `${o.delivery.city}, ул. ${o.delivery.street}, д. ${o.delivery.house}${o.delivery.apartment ? ', кв/офис ' + o.delivery.apartment : ''}`;
  return [
    `🛍 Новый заказ ${o.id}`,
    `👤 ${o.customer.name}`,
    `📞 ${o.customer.phoneFormatted}`,
    `🚚 ${L['d.' + o.delivery.method]} — ${addr}`,
    `💳 ${L['pay.' + o.payment.method]}`,
    '', ...lines, '',
    `Товары: ${fmt(o.totals.subtotal)}`,
    `Доставка: ${o.totals.delivery ? fmt(o.totals.delivery) : 'бесплатно'}`,
    `Итого: ${fmt(o.totals.total)}`,
    o.comment ? `\n💬 ${o.comment}` : '',
  ].join('\n');
}

/* ==========================================================================
   6. ХУКИ
   ========================================================================== */
function useMedia(query) {
  const get = () => (typeof window !== 'undefined' && window.matchMedia ? window.matchMedia(query).matches : false);
  const [matches, setMatches] = useState(get);
  useEffect(() => {
    if (!window.matchMedia) return undefined;
    const mq = window.matchMedia(query);
    const on = () => setMatches(mq.matches);
    on();
    if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
  }, [query]);
  return matches;
}

let scrollLocks = 0;
function useScrollLock(active = true) {
  useEffect(() => {
    if (!active) return undefined;
    scrollLocks += 1;
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    return () => {
      scrollLocks -= 1;
      if (scrollLocks === 0) { document.documentElement.style.overflow = ''; document.body.style.overflow = ''; }
    };
  }, [active]);
}

/* выполняет fn, когда сняты все блокировки прокрутки (иначе smooth-scroll обрывается при закрытии модалки) */
function whenUnlocked(fn) {
  if (scrollLocks === 0) fn(); else setTimeout(() => whenUnlocked(fn), 60);
}

/* переносит фокус в открытое окно (без видимого кольца на кнопке) */
function useAutoFocus(ref) {
  useEffect(() => { if (ref.current) ref.current.focus({ preventScroll: true }); }, []);
}

function useEscape(handler, active = true) {
  const ref = useRef(handler);
  ref.current = handler;
  useEffect(() => {
    if (!active) return undefined;
    const on = (e) => { if (e.key === 'Escape') ref.current(); };
    window.addEventListener('keydown', on);
    return () => window.removeEventListener('keydown', on);
  }, [active]);
}

const LangCtx = createContext(null);

function makeI18n(lang) {
  const base = { free: fmt(FREE_SHIPPING_FROM), addr: SHOP.address, shop: SHOP.name };
  const raw = (key) => (I18N[lang] && I18N[lang][key]) ?? I18N.ru[key] ?? key;
  const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : base[k] ?? ''));
  return {
    t: (key, vars) => { const s = raw(key); return fill(Array.isArray(s) ? s[0] : s, vars); },
    tn: (key, n) => { let s = raw(key); if (Array.isArray(s)) s = ruPlural(n, s); return fill(s, { n }); },
    tr: (o) => (o && typeof o === 'object' ? o[lang] ?? o.ru : o),
  };
}

function LangProvider({ children }) {
  const [lang, setLang] = useState(() => { const s = store.get('zk.lang', 'ru'); return s === 'kk' ? 'kk' : 'ru'; });
  useEffect(() => {
    store.set('zk.lang', lang);
    document.documentElement.lang = lang;
    document.title = `${SHOP.name} — ${makeI18n(lang).t('meta.title')}`;
  }, [lang]);
  const value = useMemo(() => ({ lang, setLang, ...makeI18n(lang) }), [lang]);
  return <LangCtx.Provider value={value}>{children}</LangCtx.Provider>;
}

/* --- корзина --- */
const CartCtx = createContext(null);
const useCart = () => useContext(CartCtx);
const CART_KEY = 'zk.cart.v1';

function loadCart() {
  const raw = store.get(CART_KEY, []);
  if (!Array.isArray(raw)) return [];
  return raw
    .filter((it) => it && PRODUCT_BY_ID[it.id] && Number.isInteger(it.qty) && it.qty > 0)
    .map((it) => {
      const p = PRODUCT_BY_ID[it.id];
      const shade = p.shades && it.shade >= 0 && it.shade < p.shades.length ? it.shade : 0;
      return { key: `${it.id}:${shade}`, id: it.id, shade, qty: Math.min(it.qty, MAX_QTY) };
    });
}

function cartReducer(state, a) {
  switch (a.type) {
    case 'add': {
      const key = `${a.id}:${a.shade}`;
      if (state.some((i) => i.key === key)) {
        return state.map((i) => (i.key === key ? { ...i, qty: Math.min(MAX_QTY, i.qty + a.qty) } : i));
      }
      return [...state, { key, id: a.id, shade: a.shade, qty: Math.min(MAX_QTY, a.qty) }];
    }
    case 'qty': return state.map((i) => (i.key === a.key ? { ...i, qty: clamp(i.qty + a.d, 1, MAX_QTY) } : i));
    case 'remove': return state.filter((i) => i.key !== a.key);
    case 'clear': return [];
    default: return state;
  }
}

function CartProvider({ children }) {
  const [items, dispatch] = useReducer(cartReducer, null, loadCart);
  useEffect(() => { store.set(CART_KEY, items); }, [items]);
  const actions = useMemo(() => ({
    add: (id, shade, qty = 1) => dispatch({ type: 'add', id, shade, qty }),
    inc: (key) => dispatch({ type: 'qty', key, d: 1 }),
    dec: (key) => dispatch({ type: 'qty', key, d: -1 }),
    remove: (key) => dispatch({ type: 'remove', key }),
    clear: () => dispatch({ type: 'clear' }),
  }), []);
  const value = useMemo(() => {
    const lines = items.map((it) => {
      const p = PRODUCT_BY_ID[it.id];
      return { ...it, p, total: p.price * it.qty };
    });
    return {
      ...actions, lines,
      count: lines.reduce((s, l) => s + l.qty, 0),
      subtotal: lines.reduce((s, l) => s + l.total, 0),
    };
  }, [items, actions]);
  return <CartCtx.Provider value={value}>{children}</CartCtx.Provider>;
}

/* стоимость доставки с учётом порога бесплатной доставки */
function shippingFor(methodId, subtotal) {
  const d = DELIVERY.find((x) => x.id === methodId) || DELIVERY[0];
  if (d.price === 0) return 0;
  return subtotal >= FREE_SHIPPING_FROM ? 0 : d.price;
}

/* Магнитная обёртка: кнопка слегка тянется за курсором (только мышь) */
function Magnetic({ children, strength = 0.32, className }) {
  const fine = useMedia(FINE);
  const calm = useMedia(REDUCE);
  const ref = useRef(null);
  const x = useMotionValue(0);
  const y = useMotionValue(0);
  const sx = useSpring(x, { stiffness: 220, damping: 16, mass: 0.3 });
  const sy = useSpring(y, { stiffness: 220, damping: 16, mass: 0.3 });
  const on = fine && !calm;
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    x.set((e.clientX - (r.left + r.width / 2)) * strength);
    y.set((e.clientY - (r.top + r.height / 2)) * strength);
  };
  const leave = () => { x.set(0); y.set(0); };
  return (
    <div ref={ref} className={className} onPointerMove={on ? move : undefined} onPointerLeave={on ? leave : undefined}>
      <motion.div style={{ x: sx, y: sy }} className="h-full w-full">{children}</motion.div>
    </div>
  );
}

  const ref = useRef(null);

  const mv = useMotionValue(value);
  useLayoutEffect(() => { if (ref.current) ref.current.textContent = format(mv.get()); }, []);
  useEffect(() => {
    if (calm) { mv.set(value); return undefined; }
    const controls = animate(mv, value, { duration: 0.7, ease: EASE });
    return () => controls.stop();
  }, [value, calm]);
  useEffect(() => mv.on('change', (v) => { if (ref.current) ref.current.textContent = format(v); }), [mv, format]);
  return <span ref={ref} className={className} />;
}

/* Кастомный курсор (только мышь, без prefers-reduced-motion) */
const CURSOR_SCALE = { idle: 1, link: 1.9, card: 2.9, text: 0.55 };
function Cursor() {
  const fine = useMedia(FINE);
  const calm = useMedia(REDUCE);
  const x = useMotionValue(-100);
  const y = useMotionValue(-100);
  const sx = useSpring(x, { stiffness: 420, damping: 34, mass: 0.5 });
  const sy = useSpring(y, { stiffness: 420, damping: 34, mass: 0.5 });
  const [mode, setMode] = useState('idle');
  const [shown, setShown] = useState(false);

  useEffect(() => {
    if (!fine || calm) return undefined;
    const move = (e) => { if (e.pointerType && e.pointerType !== 'mouse') return; x.set(e.clientX); y.set(e.clientY); setShown(true); };
    const over = (e) => {
      const el = e.target && e.target.closest ? e.target.closest('[data-cursor],a,button,select,input,textarea,label,[role="button"],[role="radio"]') : null;
      if (!el) { setMode('idle'); return; }
      setMode(el.dataset.cursor || (el.matches('input,textarea') ? 'text' : 'link'));
    };
    const leave = () => setShown(false);
    window.addEventListener('pointermove', move, { passive: true });
    window.addEventListener('pointerover', over, { passive: true });
    document.documentElement.addEventListener('mouseleave', leave);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerover', over);
      document.documentElement.removeEventListener('mouseleave', leave);
    };
  }, [fine, calm]);

  if (!fine || calm) return null;
  return (
    <>
      <motion.div aria-hidden="true" className="pointer-events-none fixed left-0 top-0 z-[300] h-10 w-10 rounded-full border border-wine/40 bg-wine/10"
                  style={{ x: sx, y: sy, marginLeft: -20, marginTop: -20 }}
                  animate={{ scale: CURSOR_SCALE[mode], opacity: shown ? 1 : 0 }} transition={{ type: 'spring', stiffness: 240, damping: 22 }} />
      <motion.div aria-hidden="true" className="pointer-events-none fixed left-0 top-0 z-[300] h-1.5 w-1.5 rounded-full bg-wine"
                  style={{ x, y, marginLeft: -3, marginTop: -3 }} animate={{ opacity: shown && mode === 'idle' ? 1 : 0 }} transition={{ duration: 0.2 }} />
    </>
  );
}

/* Фото товара «улетает» по дуге в иконку корзины */
function Flight({ f, onDone }) {
  const done = useRef(false);
  const finish = useCallback(() => { if (!done.current) { done.current = true; onDone(f); } }, [f, onDone]);
  useEffect(() => { const t = setTimeout(finish, 1700); return () => clearTimeout(t); }, [finish]);

  const path = useMemo(() => {
    const { from, to } = f;
    const N = 16;
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const dx = to.left + to.width / 2 - (from.left + from.width / 2);
    const dy = to.top + to.height / 2 - (from.top + from.height / 2);
    const arc = clamp(Math.abs(dy) * 0.3 + 70, 90, 200);
    const end = clamp(30 / Math.max(from.width, 1), 0.06, 0.3);
    const ts = Array.from({ length: N + 1 }, (_, i) => i / N);
    return {
      times: ts,
      x: ts.map((t) => dx * ease(t)),
      y: ts.map((t) => { const s = ease(t); return dy * s - arc * 4 * s * (1 - s); }),
      scale: ts.map((t) => 1 + (end - 1) * ease(t)),
      rotate: ts.map((t) => 16 * ease(t)),
      opacity: ts.map((t) => (t > 0.9 ? 1 - ((t - 0.9) / 0.1) * 0.6 : 1)),
    };
  }, [f]);

  return (
    <motion.div className="pointer-events-none fixed z-[250] overflow-hidden rounded-[1.2rem] shadow-lift"
                style={{ left: f.from.left, top: f.from.top, width: f.from.width, height: f.from.height }}
                initial={{ x: 0, y: 0, scale: 1, rotate: 0, opacity: 1 }}
                animate={{ x: path.x, y: path.y, scale: path.scale, rotate: path.rotate, opacity: path.opacity }}
                transition={{ duration: 0.95, ease: 'linear', times: path.times }}
                onAnimationComplete={finish}>
      <ProductArt p={f.p} shade={f.shade} />
    </motion.div>
  );
}

function ProductCard({ p, index = 0, matched = null, matchRank = 0, className }) {
  const { t, tr } = useLang();
  const ui = useUI();
  const fine = useMedia(FINE);
  const calm = useMedia(REDUCE);
  const [shade, setShade] = useState(0);
  const imgRef = useRef(null);
  const rx = useMotionValue(0);
  const ry = useMotionValue(0);
  const srx = useSpring(rx, { stiffness: 220, damping: 20 });
  const sry = useSpring(ry, { stiffness: 220, damping: 20 });
  const sale = discountOf(p);

  const onMove = (e) => {
    if (!fine || calm || e.pointerType !== 'mouse') return;
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    ry.set((px - 0.5) * 12);
    rx.set(-(py - 0.5) * 12);
    el.style.setProperty('--mx', `${px * 100}%`);
    el.style.setProperty('--my', `${py * 100}%`);
  };
  const onLeave = () => { rx.set(0); ry.set(0); };

  return (
    <motion.article layout="position" className={className}
      initial={{ opacity: 0, y: 40, scale: 0.96 }} whileInView={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.9, transition: { duration: 0.25 } }}
      viewport={{ once: true, margin: '0px 0px -40px 0px' }} transition={{ duration: 0.75, delay: (index % 4) * 0.08, ease: EASE }}>
      <motion.div data-cursor="card" onPointerMove={onMove} onPointerLeave={onLeave}
        style={{ rotateX: srx, rotateY: sry, transformPerspective: 900 }}
        className={cx('group relative flex h-full flex-col rounded-[1.7rem] border bg-white/70 p-2 shadow-soft transition-[box-shadow,opacity,filter,border-color] duration-500 hover:shadow-lift sm:p-3',
          matched ? 'border-wine/50 shadow-lift' : 'border-white/80', matched === false && 'opacity-45 saturate-50')}>

        <button type="button" ref={imgRef} onClick={() => ui.openQuick(p, shade)} aria-label={`${t('p.quick')}: ${tr(p.name)}`}
                className="relative block aspect-[4/5] w-full overflow-hidden rounded-[1.3rem] text-left">
          <div className="absolute inset-0 transition-opacity duration-700 group-hover:opacity-0"><ProductArt p={p} shade={shade} variant={0} /></div>
          <div className="absolute inset-0 scale-[1.06] opacity-0 transition-all duration-700 group-hover:scale-100 group-hover:opacity-100"><ProductArt p={p} shade={shade} variant={1} /></div>
          <span className="card-shine" /><span className="card-glare" />
          <span className="absolute left-2 top-2 flex flex-col items-start gap-1.5 sm:left-3 sm:top-3">
            {sale > 0 && <span className="rounded-full bg-wine px-2.5 py-1 text-[11px] font-bold text-cream shadow-soft">{t('p.sale', { n: sale })}</span>}
            {p.hit && <span className="glass rounded-full px-2.5 py-1 text-[10.5px] font-bold uppercase tracking-wider text-wine">{t('p.hit')}</span>}
          </span>
          <span className="absolute bottom-2 right-2 grid h-9 w-9 translate-y-2 place-items-center rounded-full glass-strong text-wine opacity-0 transition-all duration-500 group-hover:translate-y-0 group-hover:opacity-100 sm:bottom-3 sm:right-3" aria-hidden="true"><Icon n="eye" className="h-[18px] w-[18px]" /></span>
        </button>

        <AnimatePresence>
          {matched && (
            <motion.span initial={{ opacity: 0, scale: 0.6, y: 8 }} animate={{ opacity: 1, scale: 1, y: 0 }} exit={{ opacity: 0, scale: 0.6 }} transition={{ type: 'spring', stiffness: 380, damping: 22, delay: 0.1 + matchRank * 0.08 }}
              className="absolute right-3 top-3 z-10 flex items-center gap-1 rounded-full bg-wine px-2.5 py-1 text-[10.5px] font-bold text-cream shadow-lift sm:right-5 sm:top-5">
              <Icon n="sparkle" className="h-3 w-3" />{t('match.badge')}
            </motion.span>
          )}
        </AnimatePresence>

        <div className="flex flex-1 flex-col px-1.5 pb-1.5 pt-3">
          <p className="text-[10.5px] font-bold uppercase tracking-[0.18em] text-wine/70">{p.brand}</p>
          <h3 className="mt-1 line-clamp-2 font-serif text-[1.12rem] font-semibold leading-[1.15] sm:text-[1.28rem]">
            <button type="button" onClick={() => ui.openQuick(p, shade)} className="text-left">{tr(p.name)}</button>
          </h3>
          <p className="mt-1 line-clamp-1 text-[12.5px] text-ink/60">{tr(p.short)}</p>
          <div className="mt-2 flex items-center gap-1.5 text-[12px] text-ink/70">
            <StarIcon className="h-3.5 w-3.5 text-champagne-500" /><b className="font-semibold text-ink">{p.rating}</b><span className="text-ink/45">· {p.vol}</span>
          </div>
          <div className="mt-auto pt-3">
            {p.shades && <div className="mb-2.5"><ShadeDots shades={p.shades} value={shade} onChange={setShade} /></div>}
            <div className="flex items-baseline gap-2">
              <span className="text-[1.08rem] font-bold text-wine sm:text-[1.2rem]">{fmt(p.price)}</span>
              {p.old && <span className="text-[12.5px] text-ink/40 line-through">{fmt(p.old)}</span>}
            </div>
            <Magnetic className="mt-3" strength={0.18}>
              <button type="button" onClick={() => ui.addToCart(p, shade, 1, imgRef.current)}
                      className="flex w-full items-center justify-center gap-2 rounded-full bg-wine px-3 py-3 text-[13px] font-semibold text-cream transition-all hover:bg-wine-600 active:scale-[0.97]">
                <Icon n="bag" className="h-4 w-4" />{t('p.add')}
              </button>
            </Magnetic>
          </div>
        </div>
      </motion.div>
    </motion.article>
  );

const TRACK_PAD = (() => {
  const pad = 'max(1rem, calc((100% - 80rem) / 2 + 2rem))';   // = отступ контейнера max-w-7xl
  return { paddingLeft: pad, paddingRight: pad, scrollPaddingLeft: pad };
})();

function Hits() {
  const { t } = useLang();
  const trackRef = useRef(null);
  const drag = useRef({ down: false, x: 0, left: 0, moved: false });
  const hits = PRODUCTS.filter((p) => p.hit);

  const scrollBy = (dir) => {
    const el = trackRef.current;
    el.scrollBy({ left: dir * Math.min(el.clientWidth * 0.8, 600), behavior: 'smooth' });
  };
  /* на десктопе карусель можно «тащить» мышью; на телефоне работает нативный свайп со snap */
  const down = (e) => {
    if (e.pointerType !== 'mouse') return;
    drag.current = { down: true, x: e.clientX, left: trackRef.current.scrollLeft, moved: false };
  };
  const move = (e) => {
    const d = drag.current;
    if (!d.down) return;
    const dx = e.clientX - d.x;
    if (Math.abs(dx) > 6 && !d.moved) { d.moved = true; trackRef.current.style.scrollSnapType = 'none'; trackRef.current.style.scrollBehavior = 'auto'; }
    if (d.moved) trackRef.current.scrollLeft = d.left - dx;
  };
  const up = () => {
    const d = drag.current;
    if (!d.down) return;
    d.down = false;
    if (d.moved) { trackRef.current.style.scrollSnapType = ''; trackRef.current.style.scrollBehavior = ''; setTimeout(() => { d.moved = false; }, 0); }
  };
  const blockClick = (e) => { if (drag.current.moved) { e.stopPropagation(); e.preventDefault(); } };

  return (
    <section id="hits" className="py-12 md:py-20">
      <div className="mx-auto max-w-7xl px-4 md:px-8">
        <SectionHead eyebrow={t('hits.eyebrow')} title={t('hits.title')} sub={t('hits.sub')}
          right={<div className="hidden gap-2 md:flex">

/* ==========================================================================
   13. КАТАЛОГ: фильтры, поиск, сортировка, анимированная сетка
   ========================================================================== */
function Catalog() {
  const { t, tr } = useLang();
  const ui = useUI();
  const { category, query, sort, matchIds } = ui;

  const list = useMemo(() => {
    const q = query.trim().toLowerCase();
    let res = PRODUCTS.filter((p) => (category === 'all' || p.cat === category)
      && (!q || p.brand.toLowerCase().includes(q) || p.name.ru.toLowerCase().includes(q) || p.name.kk.toLowerCase().includes(q)));
    if (sort === 'asc') res = [...res].sort((a, b) => a.price - b.price);
    else if (sort === 'desc') res = [...res].sort((a, b) => b.price - a.price);
    else if (sort === 'rating') res = [...res].sort((a, b) => b.rating - a.rating);
    else if (matchIds) res = [...res].sort((a, b) => (matchIds.includes(b.id) - matchIds.includes(a.id)) || (matchIds.indexOf(a.id) - matchIds.indexOf(b.id)));
    return res;
  }, [category, query, sort, matchIds]);

  const counts = useMemo(() => {
    const c = { all: PRODUCTS.length };
    CATEGORIES.forEach((k) => { c[k] = PRODUCTS.filter((p) => p.cat === k).length; });
    return c;
  }, []);

  return (
    <section id="catalog" className="mx-auto max-w-7xl px-4 py-14 md:px-8 md:py-24">
      <SectionHead eyebrow={t('catalog.eyebrow')} title={t('catalog.title')} />

      <div className="mb-6 flex flex-col gap-4 md:mb-8">
        <div className="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 py-1 md:mx-0 md:flex-wrap md:px-0">
          {['all', ...CATEGORIES].map((id) => (
            <button key={id} type="button" onClick={() => ui.setCategory(id)} aria-pressed={category === id}
                    className={cx('relative shrink-0 rounded-full border px-5 py-2.5 text-[13.5px] font-semibold transition-colors', category === id ? 'border-transparent text-cream' : 'border-wine/15 bg-white/60 text-ink/80 hover:border-wine/40')}>
              {category === id && <motion.span layoutId="chip-active" className="absolute inset-0 -z-0 rounded-full bg-wine" transition={{ type: 'spring', stiffness: 420, damping: 34 }} />}
              <span className="relative z-10">{id === 'all' ? t('cat.all') : t(`cat.${id}`)} <span className={cx('ml-1 text-[11px]', category === id ? 'text-cream/60' : 'text-ink/40')}>{counts[id]}</span></span>
            </button>
          ))}
        </div>

        <div className="flex flex-wrap items-center justify-between gap-3">
          <div className="flex flex-wrap items-center gap-2 text-[13px] text-ink/60">
            <span>{t('catalog.found', { n: list.length })}</span>
            <AnimatePresence>
              {query && (
                <motion.button key="q" type="button" initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} exit={{ opacity: 0, scale: 0.8 }} onClick={() => ui.search('')}
                               className="inline-flex items-center gap-1.5 rounded-full bg-powder-200 px-3 py-1.5 font-semibold text-wine">
                  {t('catalog.query', { q: query })}<Icon n="x" className="h-3.5 w-3.5" />
                </motion.button>
              )}
            </AnimatePresence>
          </div>
          <label className="relative flex items-center">
            <span className="sr-only">{t('catalog.sort')}</span>
            <select value={sort} onChange={(e) => ui.setSort(e.target.value)}
                    className="cursor-pointer rounded-full border border-wine/15 bg-white/70 py-2.5 pl-4 pr-10 text-[13.5px] font-semibold text-ink outline-none transition focus:border-wine focus:ring-4 focus:ring-wine/10">
              {['default', 'asc', 'desc', 'rating'].map((s) => <option key={s} value={s}>{t(`sort.${s}`)}</option>)}
            </select>
            <Icon n="chevD" className="pointer-events-none absolute right-3.5 h-4 w-4 text-wine" />
          </label>
        </div>

        <AnimatePresence>
          {matchIds && (
            <motion.div key="match" initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="overflow-hidden">
              <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-wine px-5 py-3.5 text-cream">
                <span className="flex items-center gap-2.5 text-[14px] font-semibold"><Icon n="sparkle" className="h-4 w-4 text-champagne-300" />{t('match.banner', { n: matchIds.length })}</span>
                <button type="button" onClick={ui.clearMatch} className="rounded-full bg-cream/15 px-4 py-1.5 text-[12.5px] font-semibold hover:bg-cream/25">{t('match.reset')}</button>
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </div>

      <div className="grid grid-cols-2 gap-3 sm:gap-5 md:grid-cols-3 xl:grid-cols-4">
        <AnimatePresence mode="popLayout">
          {list.map((p, i) => (
            <ProductCard key={p.id} p={p} index={i} matched={matchIds ? matchIds.includes(p.id) : null} matchRank={matchIds ? Math.max(0, matchIds.indexOf(p.id)) : 0} />
          ))}
        </AnimatePresence>
      </div>

      <AnimatePresence>
        {list.length === 0 && (
          <motion.div key="empty" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="py-20 text-center">
            <span className="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full bg-powder-200 text-wine"><Icon n="search" className="h-7 w-7" /></span>
            <h3 className="font-serif text-3xl font-medium">{t('catalog.empty')}</h3>
            <p className="mt-2 text-ink/60">{t('catalog.emptyHint')}</p>
            <button type="button" onClick={ui.resetFilters} className="mt-6 rounded-full bg-wine px-6 py-3 text-sm font-semibold text-cream hover:bg-wine-600">{t('catalog.reset')}</button>
          </motion.div>
        )}
      </AnimatePresence>
    </section>
  );
}

/* ==========================================================================
   14. ОТЗЫВЫ (слайдер) И ПОДВАЛ
   ========================================================================== */
function Reviews() {
  const { t, tr } = useLang();
  const calm = useMedia(REDUCE);
  const [[idx, dir], setPage] = useState([0, 1]);
  const [paused, setPaused] = useState(false);
  const go = useCallback((d) => setPage(([i]) => [(i + d + REVIEWS.length) % REVIEWS.length, d]), []);
  useEffect(() => {
    if (paused || calm) return undefined;
    const id = setInterval(() => go(1), 7000);
    return () => clearInterval(id);
  }, [paused, calm, go]);
  const r = REVIEWS[idx];
  const product = PRODUCT_BY_ID[r.product];

  const slide = {
    enter: (d) => ({ opacity: 0, x: d * 70 }),
    center: { opacity: 1, x: 0 },
    exit: (d) => ({ opacity: 0, x: d * -70 }),
  };

  return (
    <section id="reviews" className="mx-auto max-w-7xl px-4 py-14 md:px-8 md:py-24">
      <SectionHead eyebrow={t('rev.eyebrow')} title={t('rev.title')} />
      <div onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)} onFocus={() => setPaused(true)} onBlur={() => setPaused(false)}
           className="grain relative isolate overflow-hidden rounded-[2.2rem] bg-gradient-to-br from-powder-100 to-champagne-100 p-6 shadow-soft sm:p-12">
        <span className="pointer-events-none absolute -left-2 -top-8 select-none font-serif text-[11rem] leading-none text-wine/10" aria-hidden="true">“</span>
        <div className="relative min-h-[260px] sm:min-h-[230px]" aria-live="polite">
          <AnimatePresence mode="wait" custom={dir} initial={false}>
            <motion.div key={idx} custom={dir} variants={slide} initial="enter" animate="center" exit="exit" transition={{ duration: 0.5, ease: EASE }}
                        drag="x" dragConstraints={{ left: 0, right: 0 }} dragElastic={0.25} onDragEnd={(_, info) => { if (info.offset.x < -60) go(1); else if (info.offset.x > 60) go(-1); }}
                        className="cursor-grab touch-pan-y active:cursor-grabbing">
              <Stars value={r.stars} className="h-5 w-5" />
              <blockquote className="mt-5 max-w-3xl font-serif text-[1.6rem] font-medium leading-[1.25] text-ink sm:text-[2.2rem]">{tr(r.text)}</blockquote>
              <div className="mt-6 flex flex-wrap items-center gap-4">
                <span className="grid h-12 w-12 place-items-center rounded-full bg-wine font-serif text-xl font-semibold text-cream">{r.name[0]}</span>
                <div>
                  <p className="font-semibold">{r.name}, <span className="font-normal text-ink/60">{tr(r.city)}</span></p>
                  <p className="text-[13px] text-ink/60">{t('rev.bought', { p: tr(product.name) })}</p>
                </div>
              </div>
            </motion.div>
          </AnimatePresence>
        </div>
        <div className="relative mt-6 flex items-center justify-between">
          <div className="flex gap-2">
            {REVIEWS.map((_, i) => (
              <button key={i} type="button" onClick={() => setPage([i, i > idx ? 1 : -1])} aria-label={`${i + 1}`} aria-current={i === idx}
                      className="group flex h-6 items-center"><span className={cx('block h-1.5 rounded-full transition-all duration-500', i === idx ? 'w-9 bg-wine' : 'w-4 bg-wine/25 group-hover:bg-wine/50')} /></button>
            ))}
          </div>
          <div className="flex gap-2">
            {[-1, 1].map((d) => (
              <button key={d} type="button" onClick={() => go(d)} aria-label={d < 0 ? t('rev.prev') : t('rev.next')}
                      className="grid h-11 w-11 place-items-center rounded-full border border-wine/25 text-wine transition-colors hover:bg-wine hover:text-cream"><Icon n={d < 0 ? 'chevL' : 'chevR'} className="h-5 w-5" /></button>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function ShopView() {

    const target = ui.pendingScroll.current;

/* --- квиз «подбор по типу кожи» --- */
function QuizModal({ onClose }) {
  const { t, tn } = useLang();
  const ui = useUI();
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [dir, setDir] = useState(1);
  const done = step >= QUIZ.length;
  const result = useMemo(() => (done ? matchProducts(answers) : []), [done, answers]);
  const q = QUIZ[Math.min(step, QUIZ.length - 1)];

  const choose = (qid, opt) => { setAnswers((a) => ({ ...a, [qid]: opt })); setDir(1); setStep((s) => s + 1); };
  const back = () => { setDir(-1); setStep((s) => Math.max(0, s - 1)); };
  const retry = () => { setAnswers({}); setDir(-1); setStep(0); };
  const variants = {
    enter: (d) => ({ opacity: 0, x: d * 50 }),
    center: { opacity: 1, x: 0 },
    exit: (d) => ({ opacity: 0, x: d * -50 }),
  };

  return (
    <ModalShell onClose={onClose} label={t('quiz.title')}>
      <div className="p-6 sm:p-9">
        <div className="mb-6 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3 text-[11px] font-bold uppercase tracking-[0.22em] text-wine/80"><Icon n="wand" className="h-4 w-4" />{t('quiz.title')}</div>
          <CloseButton onClose={onClose} />
        </div>
        <div className="mb-8 flex gap-1.5" aria-hidden="true">
          {QUIZ.map((_, i) => (
            <span key={i} className="h-1.5 flex-1 overflow-hidden rounded-full bg-wine/10">
              <motion.span className="block h-full origin-left rounded-full bg-wine" initial={false} animate={{ scaleX: step > i || done ? 1 : step === i ? 0.35 : 0 }} transition={{ duration: 0.5, ease: EASE }} />
            </span>
          ))}
        </div>

        <AnimatePresence mode="wait" custom={dir} initial={false}>
          {!done ? (
            <motion.div key={`q${step}`} custom={dir} variants={variants} initial="enter" animate="center" exit="exit" transition={{ duration: 0.35, ease: EASE }}>
              <p className="mb-2 text-[12.5px] font-semibold text-ink/50">{t('quiz.step', { i: step + 1, n: QUIZ.length })}</p>
              <h2 className="font-serif text-[2rem] font-medium leading-[1.08] sm:text-[2.5rem]">{t(`quiz.q.${q.id}`)}</h2>
              <div className={cx('mt-6 grid gap-2.5', q.opts.length > 4 ? 'sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-2')}>
                {q.opts.map((opt, i) => {
                  const on = answers[q.id] === opt;
                  return (
                    <motion.button key={opt} type="button" onClick={() => choose(q.id, opt)} initial={{ opacity: 0, y: 14 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.08 + i * 0.05 }} whileTap={{ scale: 0.97 }}
                                   className={cx('flex items-center justify-between gap-3 rounded-2xl border px-5 py-4 text-left text-[15px] font-semibold transition-colors',
                                     on ? 'border-wine bg-wine text-cream' : 'border-wine/15 bg-white/70 text-ink hover:border-wine/50 hover:bg-powder-100',
                                     q.opts.length % 2 === 1 && i === q.opts.length - 1 && 'sm:col-span-2')}>
                      {t(quizLabelKey(q.id, opt))}<Icon n={on ? 'check' : 'chevR'} className="h-4 w-4 shrink-0 opacity-70" />
                    </motion.button>
                  );
                })}
              </div>
              {step > 0 && (
                <button type="button" onClick={back} className="mt-6 inline-flex items-center gap-2 text-[13.5px] font-semibold text-wine hover:underline"><Icon n="arrowL" className="h-4 w-4" />{t('quiz.back')}</button>
              )}
            </motion.div>
          ) : (
            <motion.div key="result" custom={dir} variants={variants} initial="enter" animate="center" exit="exit" transition={{ duration: 0.35, ease: EASE }} className="text-center">
              <motion.span initial={{ scale: 0, rotate: -90 }} animate={{ scale: 1, rotate: 0 }} transition={{ type: 'spring', stiffness: 260, damping: 16, delay: 0.1 }}
                           className="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full bg-wine text-champagne-300"><Icon n="sparkle" className="h-8 w-8" stroke={1.4} /></motion.span>
              <p className="text-[12.5px] font-semibold uppercase tracking-[0.2em] text-wine/70">{t('quiz.result')}</p>
              <h2 className="mt-2 font-serif text-[2.6rem] font-medium leading-none">{tn('quiz.count', result.length)}</h2>
              <p className="mt-3 text-ink/65">{t('quiz.resultSub')}</p>
              <div className="my-7 flex justify-center">
                {result.slice(0, 5).map((id, i) => (
                  <motion.div key={id} initial={{ opacity: 0, y: 24, scale: 0.6 }} animate={{ opacity: 1, y: 0, scale: 1 }} transition={{ type: 'spring', stiffness: 300, damping: 20, delay: 0.25 + i * 0.09 }}
                              className="-ml-3 h-20 w-16 overflow-hidden rounded-2xl border-[3px] border-white shadow-soft first:ml-0 sm:h-24 sm:w-[76px]">
                    <ProductArt p={PRODUCT_BY_ID[id]} />
                  </motion.div>
                ))}
              </div>
              <div className="flex flex-col items-center justify-center gap-3 sm:flex-row">
                <Magnetic><button type="button" onClick={() => ui.applyMatch(result)} className="inline-flex items-center gap-2 rounded-full bg-wine px-7 py-4 text-[14.5px] font-semibold text-cream shadow-lift hover:bg-wine-600">{t('quiz.show')}<Icon n="arrowR" className="h-4 w-4" /></button></Magnetic>
                <button type="button" onClick={retry} className="rounded-full px-6 py-4 text-[14.5px] font-semibold text-wine hover:bg-powder-200/60">{t('quiz.retry')}</button>
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </div>
    </ModalShell>
  );
}

const INITIAL_FORM = { name: '', phone: '', city: '', cityOther: '', street: '', house: '', apt: '', delivery: 'courier', payment: 'kaspi', comment: '' };
const FIELD_ORDER = ['name', 'phone', 'city', 'cityOther', 'street', 'house'];

function validateForm(f) {
  const e = {};
  if (!validName(f.name)) e.name = 'e.name';
  if (f.phone.length !== 10) e.phone = 'e.phone';
  if (f.delivery !== 'pickup') {
    if (!f.city) e.city = 'e.city';
    else if (f.city === 'other' && f.cityOther.trim().length < 2) e.cityOther = 'e.cityOther';
    if (f.street.trim().length < 2) e.street = 'e.street';
    if (!f.house.trim()) e.house = 'e.house';
  }
  return e;
}

function buildOrder(form, lines, subtotal, shipping, lang) {
  const now = new Date();
  const ymd = String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
  const pickup = form.delivery === 'pickup';
  const city = CITIES.find((c) => c.id === form.city);
  return {
    id: `${SHOP.orderPrefix}-${ymd}-${Math.floor(1000 + Math.random() * 9000)}`,
    createdAt: now.toISOString(),
    lang,
    customer: { name: form.name.trim(), phone: `+7${form.phone}`, phoneFormatted: formatPhone(form.phone) },
    delivery: {
      method: form.delivery, price: shipping,
      city: pickup ? null : form.city === 'other' ? form.cityOther.trim() : city.ru,
      street: pickup ? null : form.street.trim(), house: pickup ? null : form.house.trim(), apartment: pickup ? null : form.apt.trim(),
    },
    payment: { method: form.payment },
    comment: form.comment.trim(),
    items: lines.map((l) => ({
      id: l.id, name: l.p.name.ru, brand: l.p.brand, shade: l.p.shades ? l.p.shades[l.shade].n : null,
      qty: l.qty, price: l.p.price, total: l.total,
    })),
    totals: { subtotal, delivery: shipping, total: subtotal + shipping, currency: 'KZT' },
  };
}

      <AnimatePresence initial={false}>
        {expanded && (
          <motion.div key="body" initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} transition={{ duration: 0.4, ease: EASE }} className="overflow-hidden">
            <ul className="mt-4 max-h-[320px] divide-y divide-wine/10 overflow-y-auto pr-1">

                <li key={l.key} className="flex items-center gap-3 py-3">

                    <span className="block truncate font-serif text-[1.05rem] font-semibold leading-tight">{tr(l.p.name)}</span>

                  </span>
                  <span className="text-[14px] font-bold">{fmt(l.total)}</span>

function CheckoutView() {
  const { t, tr, lang } = useLang();
  const cart = useCart();
  const ui = useUI();
  const [form, setForm] = useState(INITIAL_FORM);
  const [touched, setTouched] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [shake, setShake] = useState({});
  const [busy, setBusy] = useState(false);
  const [sendFailed, setSendFailed] = useState(false);
  const attempts = useRef(0);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, []);

  const pickup = form.delivery === 'pickup';
  const errors = validateForm(form);
  const err = (k) => ((submitted || touched[k]) && errors[k] ? t(errors[k]) : null);
  const shipping = shippingFor(form.delivery, cart.subtotal);
  const total = cart.subtotal + shipping;
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const touch = (k) => setTouched((s) => ({ ...s, [k]: true }));
  const bind = (k) => ({
    id: `f-${k}`, name: k, value: form[k], onChange: (e) => set(k, e.target.value), onBlur: () => touch(k),
    'aria-invalid': !!err(k), 'aria-describedby': err(k) ? `f-${k}-err` : undefined, className: inputCls(err(k)),
  });

  const submit = async (e) => {
    e.preventDefault();
    if (busy) return;
    setSubmitted(true);
    setSendFailed(false);
    const keys = FIELD_ORDER.filter((k) => errors[k]);
    if (keys.length) {
      attempts.current += 1;
      setShake((s) => { const n = { ...s }; keys.forEach((k) => { n[k] = attempts.current; }); return n; });
      const el = document.getElementById(`f-${keys[0]}`);
      if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus({ preventScroll: true }); }
      return;
    }
    setBusy(true);
    const order = buildOrder(form, cart.lines, cart.subtotal, shipping, lang);
    try {
      await sendOrder(order);
      ui.completeOrder(order);
    } catch (error) {
      console.error('[sendOrder] ошибка', error);
      setSendFailed(true);
      setBusy(false);
    }
  };

  const deliveryOptions = DELIVERY.map((d) => {
    const cost = shippingFor(d.id, cart.subtotal);
    return {
      id: d.id, icon: d.icon, title: t(`d.${d.id}`), note: t(`d.${d.id}.n`),
      right: cost === 0 ? t('sum.free') : fmt(cost),
    };
  });
  const paymentOptions = PAYMENTS.map((p) => ({ id: p.id, icon: p.icon, title: t(`pay.${p.id}`), note: t(`pay.${p.id}.n`) }));

  const card = 'rounded-[1.8rem] border border-white/80 bg-white/60 p-5 shadow-soft sm:p-7';
  const h = (n, text) => (
    <h2 className="mb-5 flex items-center gap-3 font-serif text-[1.65rem] font-medium leading-none">
      <span className="grid h-8 w-8 place-items-center rounded-full bg-wine font-sans text-[13px] font-bold text-cream">{n}</span>{text}
    </h2>
  );

  if (cart.lines.length === 0) {
    return (
      <div className="mx-auto max-w-lg px-4 py-24 text-center">
        <span className="mx-auto mb-5 grid h-20 w-20 place-items-center rounded-full bg-powder-200 text-wine"><Icon n="bag" className="h-9 w-9" stroke={1.4} /></span>
        <h1 className="font-serif text-4xl font-medium">{t('cart.empty')}</h1>
        <p className="mt-3 text-ink/60">{t('e.empty')}</p>
        <button type="button" onClick={() => ui.goShop({ to: 'catalog' })} className="mt-7 rounded-full bg-wine px-7 py-3.5 text-sm font-semibold text-cream hover:bg-wine-600">{t('cart.toShop')}</button>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-7xl px-4 pb-24 pt-8 md:px-8 md:pt-12">
      <button type="button" onClick={() => ui.goShop({ to: 'catalog' })} className="mb-5 inline-flex items-center gap-2 text-[13.5px] font-semibold text-wine hover:underline"><Icon n="arrowL" className="h-4 w-4" />{t('co.back')}</button>
      <h1 className="mb-8 font-serif text-[2.6rem] font-medium leading-none md:text-6xl">{t('co.title')}</h1>
      <Steps current={1} />

      <form noValidate onSubmit={submit} className="grid items-start gap-6 lg:grid-cols-[1fr_420px] lg:gap-10">
        <aside className="order-1 lg:order-2 lg:sticky lg:top-28">
          <OrderSummary shipping={shipping} total={total}>
            <div className="mt-5 hidden lg:block">
              <SubmitButton busy={busy} />
              <p className="mt-3 text-center text-[11.5px] leading-relaxed text-ink/45">{t('sum.agree')}</p>
              <button type="button" onClick={ui.openCart} className="mt-2 w-full py-2 text-[13px] font-semibold text-wine hover:underline">{t('co.edit')}</button>
            </div>
          </OrderSummary>
        </aside>

        <div className="order-2 space-y-6 lg:order-1">
          <section className={card}>
            {h(1, t('co.contact'))}
            <div className="grid gap-4 sm:grid-cols-2">
              <Field id="f-name" label={t('f.name')} error={err('name')} shake={shake.name}>
                <input {...bind('name')} type="text" autoComplete="name" placeholder={t('f.name.ph')} />
              </Field>
              <Field id="f-phone" label={t('f.phone')} error={err('phone')} shake={shake.phone}>
                <input {...bind('phone')} type="tel" inputMode="tel" autoComplete="tel" placeholder="+7 (___) ___-__-__"
                       value={formatPhone(form.phone)} onChange={(e) => set('phone', parsePhone(e.target.value))} />
              </Field>
            </div>
          </section>

          <section className={card}>
            {h(2, t('co.delivery'))}
            <RadioCards name="delivery" value={form.delivery} onChange={(v) => set('delivery', v)} options={deliveryOptions} />
            <AnimatePresence initial={false} mode="wait">
              {pickup ? (
                <motion.div key="pickup" initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="overflow-hidden">
                  <div className="mt-5 flex gap-3 rounded-2xl bg-champagne-100 p-4">
                    <Icon n="pin" className="mt-0.5 h-5 w-5 shrink-0 text-wine" />
                    <div><p className="text-[14.5px] font-semibold">{t('pickup.title')}</p><p className="mt-0.5 text-[13px] text-ink/65">{SHOP.address}</p><p className="mt-1 text-[12.5px] text-ink/55">{t('pickup.hint')}</p></div>
                  </div>
                </motion.div>
              ) : (
                <motion.div key="address" initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="-mx-1 overflow-hidden px-1">
                  <div className="grid gap-4 pt-6 sm:grid-cols-2">
                    <Field id="f-city" label={t('f.city')} error={err('city')} shake={shake.city} className={form.city === 'other' ? '' : 'sm:col-span-2'}>
                      <div className="relative">
                        <select {...bind('city')} autoComplete="address-level2" className={cx(inputCls(err('city')), 'cursor-pointer pr-11', !form.city && 'text-ink/35')}>
                          <option value="" disabled>{t('f.city.ph')}</option>
                          {CITIES.map((c) => <option key={c.id} value={c.id}>{tr(c)}</option>)}
                        </select>
                        <Icon n="chevD" className="pointer-events-none absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2 text-wine" />
                      </div>
                    </Field>
                    {form.city === 'other' && (
                      <Field id="f-cityOther" label={t('f.cityOther')} error={err('cityOther')} shake={shake.cityOther}>
                        <input {...bind('cityOther')} type="text" autoComplete="address-level2" />
                      </Field>
                    )}
                    <Field id="f-street" label={t('f.street')} error={err('street')} shake={shake.street} className="sm:col-span-2">
                      <input {...bind('street')} type="text" autoComplete="address-line1" />
                    </Field>
                    <Field id="f-house" label={t('f.house')} error={err('house')} shake={shake.house}>
                      <input {...bind('house')} type="text" autoComplete="off" />
                    </Field>
                    <Field id="f-apt" label={t('f.apt')} optional>
                      <input {...bind('apt')} type="text" autoComplete="address-line2" />
                    </Field>
                  </div>
                </motion.div>
              )}
            </AnimatePresence>
          </section>

          <section className={card}>
            {h(3, t('co.payment'))}
            <RadioCards name="payment" value={form.payment} onChange={(v) => set('payment', v)} options={paymentOptions} />
          </section>

          <section className={card}>
            <Field id="f-comment" label={t('f.comment')} optional>
              <textarea {...bind('comment')} rows={3} placeholder={t('f.comment.ph')} className={cx(inputCls(false), 'resize-none')} />
            </Field>
          </section>

          <AnimatePresence>
            {submitted && Object.keys(errors).length > 0 && (
              <motion.p key="fix" role="alert" initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="rounded-2xl bg-[#FFF0EE] px-5 py-3.5 text-[13.5px] font-semibold text-[#B3261E]">{t('e.fix')}</motion.p>
            )}
            {sendFailed && (
              <motion.p key="fail" role="alert" initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="rounded-2xl bg-[#FFF0EE] px-5 py-3.5 text-[13.5px] font-semibold text-[#B3261E]">{t('e.send')}</motion.p>
            )}
          </AnimatePresence>

          <div className="lg:hidden">
            <SubmitButton busy={busy} />
            <p className="mt-3 text-center text-[11.5px] leading-relaxed text-ink/45">{t('sum.agree')}</p>
          </div>
        </div>
      </form>
    </div>
  );
}

/* ==========================================================================
   17. ПРИЛОЖЕНИЕ: состояние, навигация между шагами, запуск
   ========================================================================== */
const plainRect = (r) => ({ left: r.left, top: r.top, width: r.width, height: r.height });

function App() {
  const cart = useCart();
  const { t, tr } = useLang();
  const calm = useMedia(REDUCE);

  const [view, setView] = useState('shop');              // shop → checkout → success
  const [category, setCategory] = useState('all');
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('default');
  const [matchIds, setMatchIds] = useState(null);        // результат квиза
  const [quick, setQuick] = useState(null);              // { p, shade } — быстрый просмотр
  const [cartOpen, setCartOpen] = useState(false);
  const [quizOpen, setQuizOpen] = useState(false);
  const [order, setOrder] = useState(null);
  const [flights, setFlights] = useState([]);            // фото, летящие в корзину
  const [bump, setBump] = useState(0);                   // «подпрыгивание» иконки корзины
  const [announce, setAnnounce] = useState('');

  const cartBtnRef = useRef(null);
  const pendingScroll = useRef(null);
  const flightId = useRef(0);

  const scrollToId = useCallback((id) => whenUnlocked(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start', behavior: calm ? 'auto' : 'smooth' });
  }), [calm]);

  const goShop = useCallback(({ to } = {}) => {
    setCartOpen(false);
    if (view === 'shop') {
      if (to) scrollToId(to); else whenUnlocked(() => window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' }));
    } else {
      pendingScroll.current = to || 'top';
      setView('shop');
    }
  }, [view, calm, scrollToId]);

  const navigateCategory = useCallback((cat) => { setCategory(cat); goShop({ to: 'catalog' }); }, [goShop]);

  const search = useCallback((v) => {
    const first = !query && v;
    setQuery(v);
    if (first) goShop({ to: 'catalog' });
  }, [query, goShop]);

  const addToCart = useCallback((p, shade, qty, el) => {
    const commit = () => {
      cart.add(p.id, shade, qty);
      setBump((b) => b + 1);
      setAnnounce(t('cart.added', { name: tr(p.name) }));
    };
    const target = cartBtnRef.current;
    if (calm || !el || !target) { commit(); return; }
    const from = el.getBoundingClientRect();
    if (from.width < 4 || from.height < 4) { commit(); return; }
    flightId.current += 1;
    setFlights((list) => [...list, { id: flightId.current, p, shade, commit, from: plainRect(from), to: plainRect(target.getBoundingClientRect()) }]);
  }, [cart.add, calm, t, tr]);

  const onFlightDone = useCallback((f) => {
    f.commit();
    setFlights((list) => list.filter((x) => x.id !== f.id));
  }, []);

  const ui = {
    view, category, query, sort, matchIds, bump, cartBtnRef, pendingScroll,
    setCategory, setSort, search, goShop, navigateCategory, addToCart,
    openCart: () => setCartOpen(true),
    openQuiz: () => setQuizOpen(true),
    openQuick: (p, shade) => setQuick({ p, shade }),
    checkout: () => { setCartOpen(false); if (cart.count > 0) setView('checkout'); },
    completeOrder: (o) => { setOrder(o); cart.clear(); setView('success'); },
    applyMatch: (ids) => {
      setMatchIds(ids); setCategory('all'); setQuery(''); setSort('default'); setQuizOpen(false);
      goShop({ to: 'catalog' });
    },
    clearMatch: () => setMatchIds(null),
    resetFilters: () => { setCategory('all'); setQuery(''); setSort('default'); setMatchIds(null); },
  };

  /* кнопка «назад» на телефоне возвращает из оформления в магазин, а не уводит с сайта */
  useEffect(() => {
    try {
      if ((view === 'checkout' || view === 'success') && window.location.hash !== `#${view}`) window.history.pushState({ v: view }, '', `#${view}`);
    } catch (e) { /* history может быть недоступна в песочнице превью */ }
  }, [view]);
  useEffect(() => {
    const onPop = () => setView((v) => ((v === 'checkout' || v === 'success') && window.location.hash !== `#${v}` ? 'shop' : v));
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  return (
    <UICtx.Provider value={ui}>
      <Header />
      <AnimatePresence mode="wait">
        <motion.main key={view} initial={{ opacity: 0, y: 18 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -14 }} transition={{ duration: 0.4, ease: EASE }}>
          {view === 'shop' && <><Marquee /><ShopView /></>}
          {view === 'checkout' && <CheckoutView />}
          {view === 'success' && <SuccessView order={order} />}
        </motion.main>
      </AnimatePresence>

      <AnimatePresence>{cartOpen && <CartDrawer key="cart" onClose={() => setCartOpen(false)} />}</AnimatePresence>
      <AnimatePresence>{quick && <QuickView key={quick.p.id} p={quick.p} initialShade={quick.shade} onClose={() => setQuick(null)} />}</AnimatePresence>
      <AnimatePresence>{quizOpen && <QuizModal key="quiz" onClose={() => setQuizOpen(false)} />}</AnimatePresence>

      {flights.map((f) => <Flight key={f.id} f={f} onDone={onFlightDone} />)}
      <Cursor />
      <div className="sr-only" role="status" aria-live="polite">{announce}</div>
    </UICtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <MotionConfig reducedMotion="user">
    <LangProvider>
      <CartProvider>
        <App />
      </CartProvider>
    </LangProvider>
  </MotionConfig>
);
</script>
</body>
</html>
